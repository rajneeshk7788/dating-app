version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: connectpulse_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: dating_chat_app
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: connectpulse_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/dating_chat_app
      JWT_SECRET: ${JWT_SECRET:-production_super_secret_jwt_key_98765}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-production_super_refresh_secret_43210}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/auth
        VITE_GRAPHQL_URL: http://localhost:5000/graphql
        VITE_SOCKET_URL: http://localhost:5000
    container_name: connectpulse_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
