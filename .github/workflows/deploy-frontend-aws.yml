name: Deploy Frontend to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-aws.yml'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    name: Build & Deploy Frontend to S3 / CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Vite App for Production
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.PROD_VITE_API_URL }}
          VITE_GRAPHQL_URL: ${{ secrets.PROD_VITE_GRAPHQL_URL }}
          VITE_SOCKET_URL: ${{ secrets.PROD_VITE_SOCKET_URL }}
        run: npm run build

      - name: Check for AWS Credentials
        id: check-aws
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$AWS_KEY" ]; then
            echo "has_aws=false" >> $GITHUB_OUTPUT
            echo "::warning::AWS_ACCESS_KEY_ID is not configured in GitHub Secrets. Build succeeded, skipping AWS S3 deployment."
          else
            echo "has_aws=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials
        if: steps.check-aws.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Static Assets to AWS S3 Bucket
        if: steps.check-aws.outputs.has_aws == 'true'
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.AWS_S3_BUCKET }} --delete --cache-control "max-age=31536000,public" --exclude "index.html"
          aws s3 cp frontend/dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate AWS CloudFront Cache
        if: steps.check-aws.outputs.has_aws == 'true'
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "Invalidating CloudFront distribution $CLOUDFRONT_DISTRIBUTION_ID..."
            aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID not set, skipping CDN cache invalidation."
          fi
